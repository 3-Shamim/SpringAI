spring:
  application:
    name: mcp-client
  profiles:
    active: dev
  ai:
    mcp:
      client:
        name: custom-mcp-client
        version: 1.0.0
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            custom-mcp-server:
              url: http://localhost:8088/mcp
    openai:
      api-key:
      chat:
        model: gpt-4o