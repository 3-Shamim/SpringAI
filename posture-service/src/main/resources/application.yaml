server:
  port: 8082

spring:
  application:
    name: posture-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified
    username: postgres
    password: postgres
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  ai:
    mcp:
      server:
        name: posture-service
        version: 1.0.0
        instructions: "This server provides posture analysis services"
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

logging:
  level:
    root: info
    fyi.shamim.postureservice: info
